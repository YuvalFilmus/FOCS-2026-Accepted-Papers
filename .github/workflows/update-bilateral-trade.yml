name: Update bilateral trade public version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-bilateral-trade.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text()
          needle = 'Multidimensional Bilateral Trade'
          url = 'https://arxiv.org/abs/2609.02872'
          articles = list(re.finditer(r'<article class="paper".*?</article>', text, re.S))
          matches = [m for m in articles if needle in m.group(0)]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one matching article, found {len(matches)}')
          m = matches[0]
          article = m.group(0)
          if url in article and 'data-status="linked"' in article:
              print('Already updated; nothing to do')
          else:
              if 'data-status="missing"' not in article:
                  raise RuntimeError('Matching article is neither missing nor already linked to expected arXiv URL')
              article = article.replace('data-status="missing"', 'data-status="linked"', 1)
              h = re.search(r'<h2>(.*?)</h2>', article, re.S)
              if not h:
                  raise RuntimeError('h2 not found')
              title = h.group(1)
              article = article[:h.start()] + f'<h2><a href="{url}" target="_blank" rel="noopener">{title}</a></h2>' + article[h.end():]
              article = article.replace('<span class="badge missing">No public version located</span>', '<span class="badge linked">Public version · arXiv</span>', 1)
              text = text[:m.start()] + article + text[m.end():]
              text, n1 = re.subn(r'<span class="stat">136 public versions located</span>', '<span class="stat">137 public versions located</span>', text, count=1)
              text, n2 = re.subn(r'<span class="stat">Updated 2026-09-02</span>', '<span class="stat">Updated 2026-09-05</span>', text, count=1)
              if n1 != 1 or n2 != 1:
                  raise RuntimeError(f'Header replacement failed: count={n1}, date={n2}')
              p.write_text(text)
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q '137 public versions located' index.html
          grep -q 'https://arxiv.org/abs/2609.02872' index.html
          test "$(grep -o 'data-status="linked"' index.html | wc -l)" -eq 137
          test "$(grep -o 'data-status="missing"' index.html | wc -l)" -eq 37
      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add bilateral trade public version'
          git push
